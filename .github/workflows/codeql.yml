name: CodeQL

on:
  pull_request:
    branches: [main, staging]
  # CodeQL ships new queries, so code that was clean in March can be flagged in
  # June with no commit involved. The schedule is what catches that.
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
